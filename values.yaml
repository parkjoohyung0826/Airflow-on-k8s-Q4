# ============================================================
# Q4 - Apache Airflow on Kubernetes
# Helm Chart: apache-airflow/airflow 1.16.0
# ============================================================

# ------------------------------------------------------------
# Airflow Executor
# 로컬 과제 환경이므로 LocalExecutor 사용
# ------------------------------------------------------------
executor: LocalExecutor


# ------------------------------------------------------------
# PostgreSQL
# 과제 조건: postgresql.enabled = true
#
# 기존 bitnami/postgresql 이미지의 과거 태그가
# Docker Hub에서 조회되지 않아 bitnamilegacy 사용
# ------------------------------------------------------------
postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r15
    pullPolicy: IfNotPresent

  auth:
    enablePostgresUser: true
    postgresPassword: postgres
    username: airflow
    password: airflow
    database: airflow

  primary:
    persistence:
      enabled: false


# ------------------------------------------------------------
# Redis
# LocalExecutor에서는 필요하지 않음
# ------------------------------------------------------------
redis:
  enabled: false


# ------------------------------------------------------------
# DAG 설정
# ------------------------------------------------------------
dags:
  persistence:
    enabled: false

  gitSync:
    enabled: true
    repo: "https://github.com/parkjoohyung0826/Airflow-on-k8s-Q4.git"
    branch: "main"
    rev: "HEAD"
    depth: 1
    subPath: "airflow-dags"
    wait: 60
    maxFailures: 0


# ------------------------------------------------------------
# 로그 PersistentVolume 비활성화
# ------------------------------------------------------------
logs:
  persistence:
    enabled: false


# ------------------------------------------------------------
# Airflow 예제 DAG 비활성화
#
# Airflow UI에서 우리가 만든 DAG 4개만 보기 위함
# ------------------------------------------------------------
config:
  core:
    load_examples: "False"


# ------------------------------------------------------------
# Webserver
# Kubernetes 내부에서는 ClusterIP 사용
# 로컬에서는 kubectl port-forward로 접속
# ------------------------------------------------------------
webserver:
  service:
    type: ClusterIP